<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LolaMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- telegram.org: ulanishning O'ZI ~200 ms turadi (DNS 4 + TCP 100 + TLS 100,
       2026-08-06 da o'lchandi) va bu SOF kechikish. Mini App uchun bu ayniqsa
       muhim — u tarmoq kengligiga umuman bog'liq emas, vaqtini faqat ulanish
       kechikishi belgilaydi (2026-08-05 o'lchovi).
       ⚠️ `crossorigin`SIZ — pastdagi skriptda ham u yo'q. Mos kelmasa brauzer
       ikkinchi ulanish ochadi va preconnect BEHUDA ketadi. -->
  <link rel="preconnect" href="https://telegram.org">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@24,600..800&family=Hanken+Grotesk:wght@400..700&family=Geist+Mono:wght@600..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=36">

  <!-- PWA: uy ekraniga qo'shish va offline sahifa -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFDFB">
  <link rel="icon" href="assets/pwa/icon-192.png">
  <link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LolaMarket">

  <!-- DIQQAT: uchala skript ham `defer` — TARTIB shu sababli saqlanadi
       (telegram → app.js → pwa.js). Bittasidan `defer` olib tashlansa,
       u tananing ichida parse paytida ishlaydi va DEFER'liklardan OLDIN
       tugaydi: `app.js` `window.Telegram`ni topa olmay qoladi.
       Ilgari bu skript defer'siz turardi va 114 KB ni uchinchi domendan
       kutib, HTML tahlilini ~600 ms to'xtatib turardi. -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="root">

    <!-- ===== HEADER ===== -->
    <header id="app-header">
      <button id="btn-back" class="icon-btn hidden" data-action="goBack">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="header-brand" class="header-brand">
        <span class="header-logo-wrap">
          <img src="assets/lola-mark.png" width="40" height="40" alt="" class="header-logo-img">
        </span>
      </div>
      <div id="header-text" class="header-text">
        <span id="header-title" class="header-title">LolaMarket</span>
        <!-- JS kelguncha ko'rinadigan matn. Ilgari bu yerda "Telegram Mini App"
             yozilardi — foydalanuvchiga TEXNIK atama ko'rinardi va brend bir
             lahzaga yo'qolardi. Endi `app.js` dagi `brandSub` bilan AYNI matn. -->
        <span id="header-sub" class="header-sub">Ulgurji matolar bozori</span>
      </div>
      <div class="header-spacer"></div>
      <!-- Mahsulot ekranining boshqaruvi — ‹ va ♡ bilan BITTA qatorda
           (founder qarori 2026-08-13). Ilgari ikkalasi `.pd-hero` ichida,
           header OSTIDA turardi va bu jimgina nuqson edi: shaffof header
           qutisi bosishni yutib qolardi (`elementFromPoint` header'ni
           qaytarardi), ya'ni "sevimli" tugmasi rasm ustida BOSILMASDI. -->
      <button id="btn-ai-jump" class="hdr-ai hidden" data-action="scrollToAi"></button>
      <button id="btn-like" class="icon-btn hidden" data-action="toggleLike">
        <svg id="btn-like-i" width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 20.8s-6.9-4.3-9-8a5.2 5.2 0 0 1-.5-3.7A4.8 4.8 0 0 1 6.3 5.5c1.9 0 3.4 1 4.3 2.3.4.6 1 .6 1.4 0 .9-1.3 2.4-2.3 4.3-2.3a4.8 4.8 0 0 1 3.8 3.6 5.2 5.2 0 0 1-.5 3.7c-2.1 3.7-9 8-9 8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-header-search" class="icon-btn hidden" data-action="navigate" data-arg="search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn notif-btn" data-action="tab" data-arg="notifications">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10.2 19.5a2 2 0 0 0 3.6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- ===== SCREEN CONTENT ===== -->
    <div id="screen-wrap"></div>

    <!-- Bottom-sheet portali — #screen-wrap skroll konteyneri sheet'ni kesib
         qo'yadi (overflow), shuning uchun sheet shu yerda, undan tashqarida turadi -->
    <div id="sheet-wrap"></div>

    <!-- ===== MAIN ACTION BUTTON (detail / checkout) ===== -->
    <div id="main-btn-bar" class="main-btn-bar hidden">
      <button class="main-action-btn" id="main-btn" data-action="mainBtnAction">
        <span id="main-btn-label">Savatga qo'shish</span>
        <span id="main-btn-sub" class="main-btn-sub">0 so'm</span>
      </button>
    </div>

    <!-- ===== SOTUVCHI NAVIGATSIYASI (kabinet rejimi) ===== -->
    <nav id="seller-nav" class="app-nav-wrap hidden">
      <div class="nav-pill">
        <div id="snav-lens" class="nav-lens snav-lens"></div>
        <button id="snav-products" class="nav-tab" data-action="sTab" data-arg="s-products">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l8.5 4.2v10.4L12 21.4 3.5 17.2V6.8L12 2.6zm0 2.3L6.2 7.8 12 10.7l5.8-2.9L12 4.9zM5.5 9.4v6.6l5.5 2.7v-6.6L5.5 9.4zm7.5 9.3l5.5-2.7V9.4L13 12.1v6.6z"/></svg>
          <span class="nav-label">Mahsulot</span>
        </button>
        <button id="snav-orders" class="nav-tab" data-action="sTab" data-arg="s-orders">
          <span class="nav-icon-wrap">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5h9.5a1 1 0 0 1 .7.3l2.5 2.5a1 1 0 0 1 .3.7V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5zM8 9.5h8a.75.75 0 0 0 0-1.5H8a.75.75 0 0 0 0 1.5zm0 4h8a.75.75 0 0 0 0-1.5H8a.75.75 0 0 0 0 1.5zm0 4h5a.75.75 0 0 0 0-1.5H8a.75.75 0 0 0 0 1.5z"/></svg>
            <span id="snav-badge" class="cart-badge hidden">0</span>
          </span>
          <span class="nav-label">Buyurtma</span>
        </button>
        <button id="snav-profile" class="nav-tab" data-action="sTab" data-arg="s-profile">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M12 13.5c-4.4 0-7.5 2.7-7.5 6a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1c0-3.3-3.1-6-7.5-6z"/></svg>
          <span class="nav-label">Profil</span>
        </button>
      </div>
    </nav>

    <!-- ===== BOTTOM NAV: dark pill + profile ===== -->
    <nav id="app-nav" class="app-nav-wrap">
      <!-- 4-tab dark pomegranate pill -->
      <div class="nav-pill" id="nav-pill">
        <!-- sliding white glass lens -->
        <div id="nav-lens" class="nav-lens"></div>
        <!-- Katalog (ekran nomi hamon `home` — bosh sahifa katalogga birlashdi) -->
        <button id="nav-home" class="nav-tab" data-action="tab" data-arg="home">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>
          <span class="nav-label">Katalog</span>
        </button>
        <!-- Cart -->
        <button id="nav-cart" class="nav-tab" data-action="tab" data-arg="cart">
          <span class="nav-icon-wrap">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 8V6.5a4.5 4.5 0 0 1 9 0V8h1.3a1.5 1.5 0 0 1 1.5 1.38l.9 10.5a1.5 1.5 0 0 1-1.5 1.62H5.3a1.5 1.5 0 0 1-1.5-1.62l.9-10.5A1.5 1.5 0 0 1 6.2 8H7.5zm2-1.5V8h5V6.5a2.5 2.5 0 0 0-5 0z"/></svg>
            <span id="cart-badge" class="cart-badge hidden">0</span>
          </span>
          <span class="nav-label">Savat</span>
        </button>
        <!-- Orders -->
        <button id="nav-orders" class="nav-tab" data-action="tab" data-arg="orders">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3.5h9.5a1 1 0 0 1 .7.3l2.5 2.5a1 1 0 0 1 .3.7V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5zM8 9.5h8a.75.75 0 0 0 0-1.5H8a.75.75 0 0 0 0 1.5zm0 4h8a.75.75 0 0 0 0-1.5H8a.75.75 0 0 0 0 1.5zm0 4h5a.75.75 0 0 0 0-1.5H8a.75.75 0 0 0 0 1.5z"/></svg>
          <span class="nav-label">Buyurtma</span>
        </button>
        <!-- AI bo'limi — OXIRGI o'rinda (founder qarori 2026-08-07).
             Katalog tabi olib tashlandi: katalog bosh sahifaga birlashdi. -->
        <button id="nav-ai" class="nav-tab" data-action="tab" data-arg="ai">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4l2.1 6.3 6.3 2.1-6.3 2.1-2.1 6.3-2.1-6.3L3.6 10.8l6.3-2.1L12 2.4z"/></svg>
          <span class="nav-label">AI</span>
        </button>
      </div>

      <!-- Separate profile pill button -->
      <button id="nav-profile" class="nav-profile-btn" data-action="tab" data-arg="profile">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M12 13.5c-4.4 0-7.5 2.7-7.5 6a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1c0-3.3-3.1-6-7.5-6z"/></svg>
      </button>
    </nav>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script defer src="app.js?v=99"></script>
  <script defer src="pwa.js?v=6"></script>
</body>
</html>
