<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LolaMarket — internet yo'q</title>
  <!-- Bu sahifa offline'da ochiladi: tashqi shrift/CSS'ga bog'lanmaydi. -->
  <style>
    :root {
      --pom-400: #E84B40;
      --pom-500: #C9362D;
      --ink-900: #171A30;
      --ink-500: #5A6480;
      --ink-100: #E8EAF0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink-900);
      background:
        radial-gradient(120% 70% at 12% 0%, rgba(255,241,232,.5) 0%, transparent 46%),
        linear-gradient(160deg, #FFFDFB, #FDF7F4);
    }
    .box { max-width: 360px; text-align: center; }
    .logo { width: 64px; height: 64px; margin-bottom: 20px; border-radius: 14px; }
    h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.55; color: var(--ink-500); margin: 0 0 24px; }
    button {
      -webkit-appearance: none;
      appearance: none;
      border: 0;
      width: 100%;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      background: var(--pom-400);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    button:active { background: var(--pom-500); }
    .hint { margin: 16px 0 0; font-size: 13px; color: var(--ink-500); }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="Photo/logo/lola-mark.png" width="64" height="64" alt="LolaMarket">
    <h1>Internet aloqasi yo'q</h1>
    <p>
      Katalog va narxlar har safar serverdan olinadi, shuning uchun
      ular offline holatda ko'rsatilmaydi. Aloqa tiklangach qayta urinib ko'ring.
    </p>
    <button type="button" onclick="location.reload()">Qayta urinish</button>
    <p class="hint" id="hint" hidden>Aloqa tiklandi — sahifa yangilanmoqda…</p>
  </div>

  <script>
    // Internet qaytishi bilan avtomatik qayta yuklaymiz.
    addEventListener('online', function () {
      document.getElementById('hint').hidden = false;
      location.reload();
    });
  </script>
</body>
</html>
