<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — LolaMarket</title>
  <link rel="icon" href="../Photo/logo/lola-mark.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css?v=21" />
  <link rel="stylesheet" href="admin.css?v=2" />
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card glass-strong">
      <img src="../Photo/logo/lola-mark.png" class="login-logo" alt="LolaMarket" />
      <div class="login-title">LolaMarket</div>
      <div class="login-sub">Admin panel</div>
      <div class="login-field">
        <input type="password" id="passwordInput" placeholder="Admin kaliti" autocomplete="current-password" />
        <button id="loginBtn" onclick="checkPassword()">Kirish</button>
      </div>
      <p class="login-error" id="loginError">Kalit noto'g'ri</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard hidden">

    <header class="admin-header glass">
      <div class="admin-header-left">
        <img src="../Photo/logo/lola-mark.png" class="admin-logo" alt="LolaMarket" />
        <div>
          <div class="admin-title">LolaMarket</div>
          <div class="admin-subtitle">Admin panel</div>
        </div>
      </div>
      <button class="admin-logout" onclick="logout()">Chiqish</button>
    </header>

    <main class="admin-main">

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card accent">
          <div class="stat-number" id="statModeration">–</div>
          <div class="stat-label">Moderatsiyada</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-number" id="statSellerApps">–</div>
          <div class="stat-label">Sotuvchi arizalari</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-number" id="statOrdersToday">–</div>
          <div class="stat-label">Bugungi buyurtmalar</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-number" id="statSellers">–</div>
          <div class="stat-label">Tasdiqlangan sotuvchilar</div>
        </div>
      </div>

      <!-- Orders -->
      <div class="section-header">
        <div class="section-title">So'nggi buyurtmalar</div>
        <div class="section-count" id="orderCount"></div>
      </div>

      <div class="orders-filters">
        <button class="order-filter active" data-filter="all">Hammasi</button>
        <button class="order-filter" data-filter="pending">Yangi</button>
        <button class="order-filter" data-filter="confirmed">Tasdiqlangan</button>
        <button class="order-filter" data-filter="shipped">Yo'lda</button>
        <button class="order-filter" data-filter="delivered">Yetkazildi</button>
        <button class="order-filter" data-filter="cancelled">Bekor qilindi</button>
      </div>

      <div class="orders-table-wrap glass">
        <table class="orders-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Xaridor</th>
              <th>Tarkib</th>
              <th>Sana</th>
              <th>Holat</th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>

      <!-- Category chart -->
      <div class="section-header" style="margin-top:2.5rem">
        <div class="section-title">Katalog — kategoriyalar bo'yicha</div>
      </div>
      <div class="chart-grid glass" id="chartGrid"></div>

    </main>
  </div>

  <script src="admin.js?v=2"></script>
</body>
</html>
