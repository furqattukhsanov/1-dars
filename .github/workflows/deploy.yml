name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 2026-08-06: `sayt-eski/` va `demo/` ro'yxatdan OLIB TASHLANDI.
          # Ilgari bu yerda "sayt-eski/ — demo/ va admin/ shu papkadagi eski
          # style.css'ga bog'liq" deb yozilgandi va bu YOLG'ON edi: `demo/`
          # repoda umuman yo'q, `admin/` esa ILDIZDAGI `style.css` ni ishlatadi
          # (`admin/index.html:13` → `../style.css`). Ya'ni papkani saqlab
          # turgan sabab tekshirilmagan da'vo bo'lib chiqdi.
          # ⚠️ Serverdagi `/var/www/lolamarket/sayt-eski/` rsync bilan
          # O'CHMAYDI — u qo'lda olib tashlanadi.
          #
          # ⚠️ Bu ro'yxat AYNAN sanab o'tadi — repoda yangi ildiz fayli paydo
          # bo'lsa, uni shu yerga QO'LDA qo'shish kerak. 2026-07-30 da landing
          # PWA fayllari (manifest.json, sw.js, pwa.js, offline.html, assets/)
          # ro'yxatga qo'shilmagani uchun serverga umuman chiqmadi: nginx yo'q
          # faylga `try_files ... /index.html` bilan HTML qaytardi, Cloudflare
          # esa o'sha HTML'ni sw.js sifatida 4 soatga keshladi.
          #
          # loyiha-panel.html — 2026-07-31 da qo'shildi. Serverda ALLAQACHON bor edi
          # (qachondir qo'lda rsync qilingan), lekin ro'yxatda bo'lmagani uchun
          # yangilanmay qolgandi: repoda 31-iyul versiyasi, serverda 30-iyulniki.
          # Aynan yuqorida yozilgan tuzoqning takrori — endi CI o'zi yangilaydi.
          #
          # offline.js va panel.js — 2026-08-06 da (C3) qo'shildi: ikkala fayl
          # ham inline `<script>` blokidan chiqarildi. Ro'yxatga qo'shilmasa
          # CSP `'unsafe-inline'`siz ishlagan kuni offline sahifadagi tugma va
          # butun sprint paneli JIMGINA o'lardi — nginx yo'q faylga HTML + 200
          # qaytaradi, ya'ni HTTP kodiga qarab buni sezib ham bo'lmasdi.
          source: "index.html,style.css,script.js,manifest.json,sw.js,pwa.js,offline.html,offline.js,loyiha-panel.html,privacy.html,panel.js,assets/,Photo/,admin/"
          target: /var/www/lolamarket

      # Mini App ALOHIDA qadam: repoda `telegram-app/`, serverda esa `mini-app/`
      # deb ataladi. Yuqoridagi ro'yxatga qo'shib bo'lmaydi — u papkani o'z nomi
      # bilan yotqizadi va `/mini-app/` bo'sh qolardi. `strip_components: 1`
      # papka nomini olib tashlaydi, target esa to'g'ri joyni ko'rsatadi.
      # 2026-07-30 gacha bu qadam umuman yo'q edi va Mini App 27-iyuldan beri
      # eskirgan holda turgandi (app.js?v=47, jonli kod esa v52 bo'lishi kerak edi).
      - name: Upload Mini App (telegram-app/ → mini-app/)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "telegram-app/*"
          target: /var/www/lolamarket/mini-app
          strip_components: 1

      # DIQQAT: bu yerda ilgari nginx konfiguratsiyasini qayta yozadigan qadam bor edi.
      # U /api/ proxy bloklarini (telegram-notify, telegram-webhook, telegram-contact,
      # order-status) o'chirib yuborardi va har push'da Telegram bildirishnomalarini
      # ishdan chiqarardi. Nginx konfiguratsiyasi endi faqat qo'lda boshqariladi —
      # kanonik nusxa: /etc/nginx/sites-available/lolamarket (serverda).
      # Tekshiruv FUNKSIONAL — konfiguratsiyadagi matnni sanamaydi.
      # Sabab: ilgari bu yerda `grep -c 'location /api'` >= 4 sharti bor edi.
      # U nginx qanday yozilganiga bog'liq edi: bloklar bitta umumiy
      # `location /api/` ga birlashtirilsa, sanoq 1 ga tushib CI qulardi va
      # butun deploy to'xtardi — nginx aslida TO'G'RI ishlayotgan bo'lsa ham.
      # Endi haqiqiy so'rov yuboriladi: javob JSON bo'lsa proxy ishlayapti.
      - name: Verify nginx /api proxy works
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CT=$(curl -s -o /dev/null -w '%{content_type}' -H 'Host: lolamarket.uz' http://127.0.0.1/api/products)
            echo "nginx → /api/products javob turi: $CT"
            case "$CT" in
              application/json*)
                echo "✅ nginx /api proxy ishlayapti" ;;
              *)
                echo "::error::/api/products JSON qaytarmadi ($CT) — nginx proxy yoki lolamarket-notify servisi ishlamayapti!"
                exit 1 ;;
            esac

      # Statik fayllar HAQIQATAN yetib bordimi.
      # Nega HTTP kodiga qaramaymiz: nginx yo'q faylga ham `try_files ... /index.html`
      # bilan 200 qaytaradi. 2026-07-30 da aynan shu chalg'itdi — `curl -o /dev/null
      # -w %{http_code}` hamma joyda 200 ko'rsatdi, holbuki fayllar serverda yo'q edi.
      # Shuning uchun javob TURI tekshiriladi: HTML kelsa fayl yetib bormagan.
      - name: Verify static files actually deployed
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            FAIL=0
            check() {
              CT=$(curl -s -o /dev/null -w '%{content_type}' -H 'Host: lolamarket.uz' "http://127.0.0.1$1")
              case "$CT" in
                $2*) echo "  ✅ $1 → $CT" ;;
                *)   echo "::error::$1 → $CT (kutilgan: $2). Fayl serverga yetib bormagan — deploy.yml dagi source ro'yxatini tekshiring."
                     FAIL=1 ;;
              esac
            }
            check /manifest.json      application/json
            check /sw.js              application/javascript
            check /pwa.js             application/javascript
            check /script.js          application/javascript
            check /mini-app/app.js    application/javascript
            # 2026-08-06 da qo'shildi: oflayn sahifaning skripti inline `<script>`
            # blokidan shu faylga chiqarildi. U yetib bormasa nuqson AYNAN oflayn
            # holatda chiqadi, ya'ni kundalik tekshiruvda hech qachon ko'rinmaydi.
            check /mini-app/offline.js application/javascript
            # 2026-08-06 (C3): landing oflayn sahifasi va sprint paneli ham
            # inline `<script>` blokidan tashqi faylga chiqdi. Ikkalasi ham
            # `source` ro'yxatiga qo'lda qo'shilgan — shu tekshiruv o'sha
            # qo'lda qadamning bajarilganini isbotlaydi.
            check /offline.js         application/javascript
            check /panel.js           application/javascript

            # HTML fayllar uchun Content-Type YARAMAYDI: nginx yo'q faylga ham
            # `try_files ... /index.html` bilan text/html qaytaradi. Shuning uchun
            # bu yerda TARKIB tekshiriladi — faqat o'sha faylda uchraydigan satr.
            check_html() {
              if curl -s -H 'Host: lolamarket.uz' "http://127.0.0.1$1" | grep -q "$2"; then
                echo "  ✅ $1 → tarkib to'g'ri ('$2' topildi)"
              else
                echo "::error::$1 ichida '$2' yo'q — fayl yetib bormagan yoki index.html fallback qaytyapti."
                FAIL=1
              fi
            }
            check_html /loyiha-panel.html 'LolaMarket — Loyiha Panel'
            # 2026-09-02: App Store uchun maxfiylik sahifasi — source ro'yxatiga
            # qo'lda qo'shilgan, bu tekshiruv o'sha qadam bajarilganini isbotlaydi.
            check_html /privacy.html 'privacy-lm'
            exit $FAIL
