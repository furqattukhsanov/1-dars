name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # sayt-eski/ — demo/ va admin/ shu papkadagi eski style.css'ga bog'liq, tushirib qoldirilmasin
          source: "index.html,style.css,script.js,Photo/,sayt-eski/,demo/,admin/"
          target: /var/www/lolamarket

      # DIQQAT: bu yerda ilgari nginx konfiguratsiyasini qayta yozadigan qadam bor edi.
      # U /api/ proxy bloklarini (telegram-notify, telegram-webhook, telegram-contact,
      # order-status) o'chirib yuborardi va har push'da Telegram bildirishnomalarini
      # ishdan chiqarardi. Nginx konfiguratsiyasi endi faqat qo'lda boshqariladi —
      # kanonik nusxa: /etc/nginx/sites-available/lolamarket (serverda).
      # Tekshiruv FUNKSIONAL — konfiguratsiyadagi matnni sanamaydi.
      # Sabab: ilgari bu yerda `grep -c 'location /api'` >= 4 sharti bor edi.
      # U nginx qanday yozilganiga bog'liq edi: bloklar bitta umumiy
      # `location /api/` ga birlashtirilsa, sanoq 1 ga tushib CI qulardi va
      # butun deploy to'xtardi — nginx aslida TO'G'RI ishlayotgan bo'lsa ham.
      # Endi haqiqiy so'rov yuboriladi: javob JSON bo'lsa proxy ishlayapti.
      - name: Verify nginx /api proxy works
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CT=$(curl -s -o /dev/null -w '%{content_type}' -H 'Host: lolamarket.uz' http://127.0.0.1/api/products)
            echo "nginx → /api/products javob turi: $CT"
            case "$CT" in
              application/json*)
                echo "✅ nginx /api proxy ishlayapti" ;;
              *)
                echo "::error::/api/products JSON qaytarmadi ($CT) — nginx proxy yoki lolamarket-notify servisi ishlamayapti!"
                exit 1 ;;
            esac
